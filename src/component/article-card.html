<div class="article-card">
  <div class="article-details">
    <p class="text-style-tags">{{author}}</p>
    <p class="text-style-tags">{{date}}</p>
    <p class="text-style-tags">{{reading_time}}</p>
  </div>
  <img src="{{image}}?as=webp" alt="{{image_description}}" />
  <h1 class="text-style-h1">{{article_title}}</h1>
  <p class="text-style-paragraph-description">{{article_description}}</p>
  <a href="" class="text-style-button cta-link">Lire plus</a>
  <div class="article-tags">
    <span class="text-style-tags">#Chicken</span>
    <span class="text-style-tags">#Funny</span>
    <span class="text-style-tags">#Fyp</span>
  </div>
</div>
